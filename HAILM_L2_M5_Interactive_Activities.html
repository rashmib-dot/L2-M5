<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Module 5 · Prototyping for Good - HAILM Level 2</title>
<meta name="description" content="Four interactive H5P activities on human-in-the-loop AI, training data and accountability. HAILM Level 2, Grades 6–8.">
<style>
/* ============================================================
   HAILM L2 · Module 5 · Prototyping for Good
   Single-file interactive activity site. No external assets.
   ============================================================ */

:root{
  --bg:#0A0E1C;
  --panel:#141B33; --panel2:#1B2447; --panel3:#232E58;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#EEF2FF; --ink2:#B9C4E4; --muted:#8592B8;
  --mango:#FFB02E; --mango2:#FF8A3D;
  --cyan:#3FE0DA; --violet:#A78BFA; --pink:#FF7AB6;
  --ok:#43DD9A; --no:#FF6B6B;
  --r:16px; --r2:22px;
  --shadow:0 18px 50px -18px rgba(0,0,0,.85);
  --ff:'Inter','Noto Sans Devanagari','Nirmala UI',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Mangal',Helvetica,Arial,sans-serif;
  --fd:'Space Grotesk','Inter','Noto Sans Devanagari','Nirmala UI',ui-sans-serif,system-ui,'Mangal',sans-serif;
  --nav-w:296px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ff);
  font-size:16px; line-height:1.6; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(255,176,46,.16), transparent 62%),
    radial-gradient(820px 520px at 96% 4%, rgba(63,224,218,.14), transparent 60%),
    radial-gradient(700px 620px at 50% 108%, rgba(167,139,250,.13), transparent 62%);
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
img,svg{max-width:100%}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--fd); line-height:1.2; margin:0}
p{margin:0 0 .9em}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--cyan); outline-offset:3px; border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.nav{
  width:var(--nav-w); flex:0 0 var(--nav-w); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column;
  background:linear-gradient(180deg,rgba(20,27,51,.96),rgba(10,14,28,.96));
  border-right:1px solid var(--line); backdrop-filter:blur(12px); z-index:60;
}
.brand{padding:18px 18px 12px; border-bottom:1px solid var(--line)}
.brand .kicker{font:700 10.5px/1 var(--ff); letter-spacing:.16em; text-transform:uppercase; color:var(--mango)}
.brand h1{font-size:19px; margin:8px 0 4px; letter-spacing:-.02em}
.brand .sub{font-size:11.5px; color:var(--muted); letter-spacing:.02em}

.prog{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:13px}
.ring{position:relative; width:52px; height:52px; flex:0 0 52px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font:800 13px/1 var(--fd);color:var(--ink)}
.prog .meta{min-width:0}
.prog .meta b{display:block;font:800 13px/1.3 var(--fd)}
.prog .meta span{font-size:11.5px;color:var(--muted)}
.xp{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 9px;border-radius:999px;
  background:rgba(255,176,46,.14); border:1px solid rgba(255,176,46,.34); color:var(--mango);
  font:800 11px/1 var(--fd); letter-spacing:.03em}

.navlist{flex:1 1 auto; overflow-y:auto; padding:10px 10px 16px; scrollbar-width:thin}
.navlist::-webkit-scrollbar{width:8px}
.navlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
.navsec{font:700 10px/1 var(--ff);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  padding:12px 10px 8px}
.nitem{
  display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:1px solid transparent; color:var(--ink2);
  padding:9px 10px; border-radius:13px; margin-bottom:3px; transition:.16s;
}
.nitem:hover{background:rgba(255,255,255,.055); color:var(--ink)}
.nitem.on{background:linear-gradient(90deg,rgba(255,176,46,.20),rgba(255,176,46,.05));
  border-color:rgba(255,176,46,.42); color:#fff}
.nitem .dot{
  flex:0 0 25px;height:25px;border-radius:9px;display:grid;place-items:center;
  background:rgba(255,255,255,.08); border:1px solid var(--line2);
  font:800 11.5px/1 var(--fd); color:var(--ink2); transition:.16s
}
.nitem.on .dot{background:var(--mango);color:#231400;border-color:transparent}
.nitem.done .dot{background:var(--ok);color:#05271a;border-color:transparent}
.nitem .tx{min-width:0}
.nitem .tx b{display:block;font:700 13px/1.35 var(--ff)}
.nitem .tx span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;
  text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.nitem.on .tx span{color:rgba(255,224,170,.9)}

.navfoot{padding:10px 14px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.tinybtn{flex:1 1 auto;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--ink2);
  border-radius:11px;padding:8px 10px;font:700 11.5px/1 var(--ff);cursor:pointer;transition:.15s}
.tinybtn:hover{background:rgba(255,255,255,.12);color:#fff}

/* ---------- main ---------- */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:11px 22px; background:rgba(10,14,28,.82); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.burger{display:none;background:rgba(255,255,255,.07);border:1px solid var(--line2);color:var(--ink);
  width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:17px;flex:0 0 auto}
.crumb{font:700 12px/1 var(--ff);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.crumb b{color:var(--mango)}
.steps{margin-left:auto;display:flex;gap:5px;align-items:center}
.step{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);border:0;padding:0;cursor:pointer;
  transition:.18s}
.step:hover{transform:scale(1.35)}
.step.done{background:var(--ok)}
.step.on{background:var(--mango);width:24px;border-radius:9px}
.barline{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--mango),var(--cyan));
  transition:width .5s cubic-bezier(.4,0,.2,1)}

.stage{flex:1 1 auto;padding:26px 22px 130px;max-width:1000px;width:100%;margin:0 auto}
@media (min-width:1500px){.stage{max-width:1080px}}

/* ---------- activity card ---------- */
.ahead{margin-bottom:20px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.tag{font:800 10.5px/1 var(--ff);letter-spacing:.1em;text-transform:uppercase;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink2)}
.tag.h5p{background:rgba(63,224,218,.13);border-color:rgba(63,224,218,.38);color:var(--cyan)}
.tag.time{background:rgba(167,139,250,.13);border-color:rgba(167,139,250,.38);color:var(--violet)}
.tag.core{background:rgba(255,176,46,.13);border-color:rgba(255,176,46,.38);color:var(--mango)}
.ahead h2{font-size:clamp(26px,4.4vw,40px);letter-spacing:-.03em;
  background:linear-gradient(96deg,#fff 20%,#FFD79A 78%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:#fff}
.ahead .lede{color:var(--ink2);font-size:16.5px;margin-top:9px;max-width:74ch}

.card{background:linear-gradient(180deg,rgba(27,36,71,.86),rgba(20,27,51,.86));
  border:1px solid var(--line); border-radius:var(--r2); padding:22px; box-shadow:var(--shadow); margin-bottom:18px}
.card.tight{padding:16px}
.card h3{font-size:18px;margin-bottom:6px}
.card h4{font-size:14px;letter-spacing:.02em;margin-bottom:8px;color:var(--ink)}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2);
  background:rgba(63,224,218,.08);border:1px solid rgba(63,224,218,.24);border-radius:14px;padding:12px 14px}
.hint .ic{flex:0 0 auto;font-size:16px;line-height:1.35}
.reveal{background:linear-gradient(135deg,rgba(255,176,46,.14),rgba(255,138,61,.07));
  border:1px solid rgba(255,176,46,.4);border-radius:16px;padding:16px 18px}
.reveal b{color:var(--mango)}
.big{font:700 19px/1.45 var(--fd);color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border-radius:13px;padding:12px 20px;font:800 14px/1 var(--ff);letter-spacing:.01em;
  border:1px solid transparent;transition:transform .12s,filter .16s,background .16s}
.btn:active{transform:translateY(1px)}
.btn.p{background:linear-gradient(96deg,var(--mango),var(--mango2));color:#2A1600}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{background:rgba(255,255,255,.07);border-color:var(--line2);color:var(--ink)}
.btn.s:hover{background:rgba(255,255,255,.14)}
.btn.c{background:linear-gradient(96deg,var(--cyan),#31B7C8);color:#04262A}
.btn:disabled{opacity:.42;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* generic option buttons */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.045);border:1.5px solid var(--line2);color:var(--ink);
  border-radius:15px;padding:14px 16px;margin-bottom:9px;font-size:15px;transition:.15s;line-height:1.45}
.opt:hover:not(:disabled){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.32);transform:translateX(3px)}
.opt .k{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.1);
  font:800 12px/1 var(--fd);color:var(--ink2)}
.opt.right{background:rgba(67,221,154,.15);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#05271a}
.opt.wrong{background:rgba(255,107,107,.13);border-color:var(--no)}
.opt.wrong .k{background:var(--no);color:#2b0505}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:13px 15px;font-size:14.5px;margin-top:4px;line-height:1.5}
.fb.y{background:rgba(67,221,154,.13);border:1px solid rgba(67,221,154,.4)}
.fb.n{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4)}

/* footer nav */
.footnav{
  position:fixed;left:var(--nav-w);right:0;bottom:0;z-index:55;
  display:flex;align-items:center;gap:12px;padding:12px 22px;
  background:rgba(10,14,28,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);
}
.footnav .mid{flex:1 1 auto;text-align:center;min-width:0}
.footnav .mid .t{font:800 13px/1.3 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footnav .mid .s{font-size:11px;color:var(--muted)}
.doneflag{display:inline-flex;align-items:center;gap:6px;font:800 11.5px/1 var(--ff);color:var(--ok);
  background:rgba(67,221,154,.14);border:1px solid rgba(67,221,154,.4);padding:5px 10px;border-radius:999px}

/* mobile */
.scrim{display:none;position:fixed;inset:0;background:rgba(4,6,14,.68);z-index:59;backdrop-filter:blur(3px)}
@media (max-width:980px){
  :root{--nav-w:0px}
  .nav{position:fixed;left:0;top:0;width:290px;flex-basis:290px;transform:translateX(-102%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:0 0 60px rgba(0,0,0,.6)}
  body.navopen .nav{transform:none}
  body.navopen .scrim{display:block}
  .burger{display:grid;place-items:center}
  .footnav{left:0}
  .stage{padding:20px 15px 130px}
  .topbar{padding:10px 14px}
  .card{padding:17px;border-radius:18px}
}
@media (max-width:560px){
  .steps{display:none}
  .footnav{padding:10px 12px}
  .btn{padding:11px 15px;font-size:13.5px}
}

/* toast */
#toasts{position:fixed;right:16px;top:70px;z-index:200;display:flex;flex-direction:column;gap:9px;
  align-items:flex-end;pointer-events:none}
.toast{background:linear-gradient(96deg,rgba(35,46,88,.98),rgba(27,36,71,.98));border:1px solid var(--line2);
  border-left:4px solid var(--mango);border-radius:13px;padding:11px 15px;box-shadow:var(--shadow);
  font:700 13.5px/1.4 var(--ff);max-width:300px;animation:tin .3s both}
.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:0;transform:translateX(30px)}}

/* confetti */
#conf{position:fixed;inset:0;z-index:190;pointer-events:none}

/* ---------- activity-specific ---------- */
/* 1 word cloud */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--ink2);border-radius:999px;
  padding:8px 14px;font:700 13px/1 var(--ff);cursor:pointer;transition:.15s}
.chip:hover{background:rgba(255,176,46,.18);border-color:var(--mango);color:#fff}
.chip.used{opacity:.35;pointer-events:none}
.cloud{min-height:190px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;
  padding:22px 14px;border-radius:18px;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.05),transparent 70%);
  border:1px dashed var(--line2)}
.cw{font-family:var(--fd);font-weight:800;letter-spacing:-.02em;animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;
  transition:.3s}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.cw.rule{color:var(--cyan)} .cw.learn{color:var(--mango)}
.empty{color:var(--muted);font-size:14px;font-style:italic}
.inputrow{display:flex;gap:9px;flex-wrap:wrap}
input[type=text],textarea,select{
  background:rgba(255,255,255,.06);border:1.5px solid var(--line2);color:var(--ink);
  border-radius:13px;padding:12px 15px;font:500 15px/1.5 var(--ff);width:100%;transition:.15s}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--mango);background:rgba(255,255,255,.1);outline:none}
textarea{resize:vertical;min-height:130px}
::placeholder{color:var(--muted)}

/* 2 toaster */
.scene{display:grid;place-items:center;padding:10px}
.choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.cchoice{cursor:pointer;background:rgba(255,255,255,.05);border:1.5px solid var(--line2);border-radius:17px;
  padding:18px 15px;text-align:center;transition:.18s;color:var(--ink)}
.cchoice:hover{transform:translateY(-4px);border-color:var(--mango);background:rgba(255,176,46,.1)}
.cchoice .em{font-size:38px;display:block;margin-bottom:8px}
.cchoice b{font:800 14.5px/1.3 var(--fd);display:block}
.cchoice small{color:var(--muted);font-size:12px}
.result{text-align:center;padding:8px}
.result .em{font-size:64px;display:block;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
.tried{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.tried span{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid var(--line2);color:var(--muted)}
.tried span.ok{color:var(--ok);border-color:rgba(67,221,154,.4)}

/* 3 hotspots */
.hswrap{position:relative;border-radius:18px;overflow:hidden;background:#0B1226;border:1px solid var(--line)}
.hs{position:absolute;width:38px;height:38px;border-radius:50%;border:2px solid #fff;cursor:pointer;
  background:rgba(255,176,46,.9);color:#2A1600;font:800 15px/1 var(--fd);display:grid;place-items:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(255,176,46,.22);transition:.18s}
.hs:hover{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 11px rgba(255,176,46,.26)}
.hs.seen{background:var(--ok);color:#05271a;box-shadow:0 0 0 5px rgba(67,221,154,.2)}
.hs::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,176,46,.7);
  animation:ping 2s ease-out infinite}
.hs.seen::after{display:none}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.hspanel{min-height:96px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.045);
  padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.hspanel .em{font-size:30px;line-height:1}
.hspanel b{display:block;font:800 15.5px/1.3 var(--fd);margin-bottom:4px}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{width:26px;height:5px;border-radius:9px;background:rgba(255,255,255,.16)}
.dots i.on{background:var(--ok)}

/* 4 sort */
.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.zones{grid-template-columns:1fr}}
.zone{border:2px dashed var(--line2);border-radius:18px;padding:14px;min-height:150px;transition:.18s;
  background:rgba(255,255,255,.03)}
.zone.rules{border-color:rgba(63,224,218,.4)}
.zone.learn{border-color:rgba(255,176,46,.4)}
.zone.good{border-color:rgba(67,221,154,.45)}
.zone.good h4{color:var(--ok)}
.zone.bad{border-color:rgba(255,107,107,.45)}
.zone.bad h4{color:var(--no)}
.zone.hot{background:rgba(255,255,255,.1);border-style:solid;transform:scale(1.015)}
.zone h4{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:10px;letter-spacing:.04em;
  text-transform:uppercase}
.zone.rules h4{color:var(--cyan)} .zone.learn h4{color:var(--mango)}
.bank{display:flex;flex-wrap:wrap;gap:9px;min-height:56px}
.mcard{cursor:grab;background:linear-gradient(180deg,rgba(35,46,88,.95),rgba(27,36,71,.95));
  border:1.5px solid var(--line2);border-radius:13px;padding:10px 14px;font:700 13.5px/1.3 var(--ff);
  display:inline-flex;align-items:center;gap:8px;transition:.15s;user-select:none;touch-action:manipulation}
.mcard:hover{border-color:var(--mango);transform:translateY(-2px)}
.mcard.sel{border-color:var(--mango);background:rgba(255,176,46,.2);box-shadow:0 0 0 4px rgba(255,176,46,.18)}
.mcard.drag{opacity:.4}
.mcard.good{border-color:var(--ok);background:rgba(67,221,154,.16)}
.mcard.bad{border-color:var(--no);background:rgba(255,107,107,.16);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 5 rover */
.rvstage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#05070F}
.rvbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.04);
  border-top:1px solid var(--line)}
.track{flex:1 1 auto;height:7px;border-radius:9px;background:rgba(255,255,255,.13);position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--mango),var(--cyan));
  border-radius:9px;transition:width .3s linear}
.mark{position:absolute;top:-4px;width:3px;height:15px;background:var(--violet);border-radius:2px}
.tt{font:800 12px/1 var(--fd);color:var(--ink2);min-width:70px;text-align:right}
.pausecard{border:1px solid rgba(167,139,250,.45);background:linear-gradient(135deg,rgba(167,139,250,.14),rgba(167,139,250,.05));
  border-radius:18px;padding:18px}
.pausecard .lab{font:800 10.5px/1 var(--ff);letter-spacing:.14em;text-transform:uppercase;color:var(--violet);
  margin-bottom:9px}

/* 6 flashcards */
.deck{perspective:1400px;max-width:560px;margin:0 auto}
.flip{position:relative;width:100%;min-height:230px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);
  cursor:pointer}
.flip.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 26px;
  border:1.5px solid var(--line2)}
.face.front{background:linear-gradient(150deg,#232E58,#1B2447)}
.face.back{transform:rotateY(180deg);background:linear-gradient(150deg,rgba(255,176,46,.22),rgba(255,138,61,.1));
  border-color:rgba(255,176,46,.5)}
.face .lab{font:800 10.5px/1 var(--ff);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.face.back .lab{color:var(--mango)}
.face .tx{font:700 19.5px/1.45 var(--fd)}
.face .tip{margin-top:16px;font-size:12px;color:var(--muted)}
.deckbar{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;flex-wrap:wrap}
.pill{font:800 12px/1 var(--fd);color:var(--ink2);background:rgba(255,255,255,.07);border:1px solid var(--line2);
  padding:8px 13px;border-radius:999px}

/* 7 agamotto */
.doodle{border-radius:18px;background:#F7F5EE;border:1px solid var(--line);display:grid;place-items:center;padding:8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:9px;
  background:linear-gradient(90deg,var(--mango),var(--cyan))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;border:4px solid var(--mango);margin-top:-9px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--mango),var(--cyan))}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--mango)}
.stagelabs{display:flex;justify-content:space-between;font:700 10.5px/1.3 var(--ff);color:var(--muted);gap:6px}
.stagelabs span{flex:1;text-align:center}
.stagelabs span.on{color:var(--mango)}

/* 8 drag the words */
.sent{font:600 17px/2.3 var(--ff);color:var(--ink);margin-bottom:14px}
.blank{display:inline-block;min-width:118px;padding:4px 12px;margin:0 3px;border-radius:10px;
  border:2px dashed var(--line2);background:rgba(255,255,255,.05);text-align:center;font-weight:800;
  color:var(--muted);transition:.16s;vertical-align:middle;cursor:pointer;font-size:15px}
.blank.hot{border-color:var(--mango);background:rgba(255,176,46,.16)}
.blank.filled{border-style:solid;color:#fff;border-color:var(--line2);background:rgba(255,255,255,.12)}
.blank.good{border-style:solid;border-color:var(--ok);background:rgba(67,221,154,.2);color:#fff}
.blank.bad{border-style:solid;border-color:var(--no);background:rgba(255,107,107,.2);color:#fff;animation:shake .35s}
.wordbank{display:flex;flex-wrap:wrap;gap:9px}
.word{cursor:grab;background:linear-gradient(180deg,rgba(255,176,46,.24),rgba(255,138,61,.12));
  border:1.5px solid rgba(255,176,46,.5);color:#fff;border-radius:11px;padding:8px 15px;font:800 14px/1 var(--ff);
  user-select:none;transition:.15s}
.word:hover{transform:translateY(-2px)}
.word.sel{box-shadow:0 0 0 4px rgba(255,176,46,.25);transform:translateY(-2px)}
.word.used{opacity:.25;pointer-events:none}

/* 9 quiz */
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.scorebig{font:800 44px/1 var(--fd);background:linear-gradient(96deg,var(--mango),var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.qdots{display:flex;gap:5px}
.qdots i{width:22px;height:6px;border-radius:9px;background:rgba(255,255,255,.16)}
.qdots i.y{background:var(--ok)} .qdots i.n{background:var(--no)} .qdots i.c{background:var(--mango)}

.kw{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.kwb{font:800 11.5px/1 var(--ff);padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.06);

.kwb.hit{background:rgba(67,221,154,.18);border-color:var(--ok);color:#fff}
.counter{font:700 12px/1 var(--ff);color:var(--muted);margin-top:8px}
.counter.ok{color:var(--ok)}

.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stepbtn{flex:1 1 130px;background:rgba(255,255,255,.05);border:1.5px solid var(--line2);border-radius:14px;
  padding:11px 12px;cursor:pointer;text-align:left;color:var(--ink2);transition:.16s}
.stepbtn.on{border-color:var(--mango);background:rgba(255,176,46,.14);color:#fff}
.stepbtn.done{border-color:rgba(67,221,154,.5)}
.stepbtn b{display:block;font:800 12.5px/1.3 var(--fd)}
.stepbtn span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--muted)}
.logrow{display:grid;grid-template-columns:1.3fr 1fr 1.4fr auto;gap:9px;align-items:center;margin-bottom:9px}
@media (max-width:760px){.logrow{grid-template-columns:1fr;gap:7px;padding-bottom:11px;border-bottom:1px solid var(--line)}}
.del{background:rgba(255,107,107,.14);border:1px solid rgba(255,107,107,.4);color:var(--no);border-radius:10px;

table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th{text-align:left;font:800 10.5px/1 var(--ff);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line2)}
table.log td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}

.cert{background:linear-gradient(150deg,#1B2447,#131A32);border:2px solid rgba(255,176,46,.5);border-radius:24px;
  padding:34px 28px;text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:-40% -10% auto;height:70%;

.cert .seal{font-size:56px}
.cert h3{font-size:26px;margin:10px 0 4px}
.badges{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
.badge{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font:800 12px/1 var(--ff);

.badge.got{background:rgba(255,176,46,.16);border-color:rgba(255,176,46,.5);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.modal{position:fixed;inset:0;z-index:210;display:none;place-items:center;padding:20px;

.modal.on{display:grid}
.mbox{background:var(--panel2);border:1px solid var(--line2);border-radius:22px;padding:24px;max-width:520px;

.kbd{display:inline-block;background:rgba(255,255,255,.1);border:1px solid var(--line2);border-radius:7px;

ul.clean{margin:0;padding-left:20px;color:var(--ink2);font-size:14.5px}
ul.clean li{margin-bottom:7px}

.wslot{display:flex;gap:9px;flex-wrap:wrap;align-items:center;min-height:78px;padding:16px 12px 12px;

.wslot.hot{border-color:var(--mango);background:rgba(255,176,46,.1)}
.wslot.good{border-style:solid;border-color:var(--ok);background:rgba(67,221,154,.07)}
.wslot.bad{border-style:solid;border-color:var(--no);animation:shake .35s}
.bricktray{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-height:56px;padding-top:8px}
.brick{position:relative;border-radius:9px;padding:15px 17px 12px;font:800 17px/1 var(--fd);
  cursor:pointer;user-select:none;box-shadow:0 4px 0 rgba(0,0,0,.42);transition:transform .12s,box-shadow .12s;
  margin-top:6px}
.brick:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.42)}
.brick:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.42)}
.brick::before,.brick::after{content:'';position:absolute;top:-6px;width:14px;height:9px;border-radius:5px 5px 2px 2px}
.brick::before{left:12px} .brick::after{right:12px}
.brick.c1{background:linear-gradient(180deg,#FFC960,#E8901A);color:#2A1600}
.brick.c1::before,.brick.c1::after{background:#FFD98A}
.brick.c2{background:linear-gradient(180deg,#6FE9E4,#25A9A4);color:#04262A}
.brick.c2::before,.brick.c2::after{background:#93F2EE}
.brick.c3{background:linear-gradient(180deg,#C4AEFF,#7E5CE6);color:#150E33}
.brick.c3::before,.brick.c3::after{background:#D9CBFF}


/* ---- Module 5: blueprint strip ---- */
.steprow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;justify-content:center}
.stepbox{flex:1 1 130px;min-width:120px;background:rgba(255,255,255,.05);border:1.5px solid var(--line2);
  border-radius:16px;padding:16px 12px;text-align:center}
.stepbox .em{font-size:30px;line-height:1.1}
.stepbox b{display:block;font:800 15px/1.3 var(--fd);color:var(--mango);margin-top:8px}
.stepbox span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.steparr{display:flex;align-items:center;color:var(--muted);font:800 20px/1 var(--fd)}
@media (max-width:640px){.steparr{display:none}}

@media print{.nav,.topbar,.footnav,#stars,.scrim{display:none!important} body{background:#fff;color:#000}}

/* ---------- confetti ---------- */
var cf = $('#conf'), cx = cf.getContext('2d'), parts = [], raf = null;
function sizeCf(){cf.width=innerWidth; cf.height=innerHeight;}
sizeCf(); addEventListener('resize', sizeCf);
function confetti(n){
  n = n||90;
  var cols = ['#FFB02E','#3FE0DA','#A78BFA','#FF7AB6','#43DD9A','#FFFFFF'];
  for(var i=0;i<n;i++) parts.push({
    x: innerWidth/2 + (Math.random()-.5)*innerWidth*.7, y: innerHeight*.28 + Math.random()*60,
    vx:(Math.random()-.5)*9, vy:-Math.random()*11-4, g:.28+Math.random()*.16,
    s:5+Math.random()*7, r:Math.random()*6.28, vr:(Math.random()-.5)*.3,
    c:cols[(Math.random()*cols.length)|0]
  });
  if(!raf) raf = requestAnimationFrame(step);
}
function step(){
  cx.clearRect(0,0,cf.width,cf.height);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vx*=.995;
    if(p.y>innerHeight+40){parts.splice(i,1);continue;}
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore();
  }
  if(parts.length) raf = requestAnimationFrame(step); else {raf=null; cx.clearRect(0,0,cf.width,cf.height);}
}
window.confetti = confetti;

/* ---------- starfield ---------- */
(function(){
  var c=$('#stars'), g=c.getContext('2d'), stars=[];
  function build(){
    c.width=innerWidth; c.height=innerHeight; stars=[];
    var n=Math.min(150, Math.round(innerWidth*innerHeight/12000));
    for(var i=0;i<n;i++) stars.push({x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.25+.25,a:Math.random(),d:(Math.random()*.014)+.003});
  }
  build(); addEventListener('resize',build);
  (function loop(){
    g.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){var s=stars[i]; s.a+=s.d; if(s.a>1||s.a<.12)s.d*=-1;
      g.globalAlpha=Math.max(.1,Math.min(1,s.a)); g.fillStyle='#fff';
      g.beginPath(); g.arc(s.x,s.y,s.r,0,6.283); g.fill();}
    g.globalAlpha=1; requestAnimationFrame(loop);
  })();
})();

      d.innerHTML='<h4>'+z[0]+' '+z[1]+'</h4>';
      var inner=el('div','bank'); d.appendChild(inner); Z.push(inner); zoneBox.push(d);

      }

      var f=card();

reg({
  id:'resp', xp:120,
  title:{en:'Who Is Responsible?', hi:'ज़िम्मेदार कौन है?'},
  h5p:{en:'Flashcards', hi:'फ़्लैशकार्ड'},
  time:{en:'7–9 min', hi:'7–9 मिनट'},
  slides:{en:'Slide 8 - Responsibility check', hi:'स्लाइड 8 - ज़िम्मेदारी जाँच'},
  lede:{en:'Four situations. For each one, answer <b>out loud</b> before you flip: who is actually responsible here?',
        hi:'चार स्थितियाँ। हर एक पर पलटने से पहले <b>ज़ोर से</b> जवाब दीजिए: यहाँ असल में ज़िम्मेदार कौन है?'},
  render:function(root, api){
    var L=T(A3), CARDS=L.cards, TOT=CARDS.length;
    var got=api.get('got',{}); var i=0, flipped=false;
    var c=card(); c.innerHTML='<h3>'+L.h3+'</h3>';
    var deck=el('div','deck'), flip=el('div','flip');
    var front=el('div','face front'), back=el('div','face back');
    flip.appendChild(front); flip.appendChild(back);
    flip.setAttribute('role','button'); flip.tabIndex=0;
    deck.appendChild(flip); c.appendChild(deck);
    var bar=el('div','deckbar');
    var prev=el('button','btn s','←'); prev.style.padding='11px 15px';
    var pill=el('div','pill','1 / '+TOT);
    var next=el('button','btn s','→'); next.style.padding='11px 15px';
    bar.appendChild(prev); bar.appendChild(pill); bar.appendChild(next); c.appendChild(bar);
    var rate=el('div','row'); rate.style.cssText='justify-content:center;margin-top:12px';
    var again=el('button','btn s',L.again), ok=el('button','btn c',L.ok);
    rate.appendChild(again); rate.appendChild(ok); c.appendChild(rate);
    var cnt=el('div','counter'); cnt.style.textAlign='center'; c.appendChild(cnt);
    root.appendChild(c);
    var after=el('div'); root.appendChild(after);

    function draw(){
      var cd=CARDS[i];
      front.innerHTML='<div class="lab">'+L.qlab(i+1)+'</div><div class="tx">'+cd[0]+'</div><div class="tip">'+L.tapTip+'</div>';
      back.innerHTML='<div class="lab">'+L.alab+'</div><div class="tx">'+cd[1]+'</div><div class="tip">'+(got[i]?L.gotTip:L.rateTip)+'</div>';
      flip.classList.toggle('f', flipped);
      pill.textContent=(i+1)+' / '+TOT;
      var n=Object.keys(got).length;
      cnt.textContent=L.count(n); cnt.classList.toggle('ok', n===TOT);
      rate.style.opacity=flipped?'1':'.35'; rate.style.pointerEvents=flipped?'auto':'none';
      if(n===TOT) done();
    }
    function move(d){ i=(i+d+TOT)%TOT; flipped=false; draw(); }
    on(flip,'click',function(){flipped=!flipped; draw();});
    on(flip,'keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault(); flipped=!flipped; draw();} });
    on(prev,'click',function(){move(-1);}); on(next,'click',function(){move(1);});
    on(ok,'click',function(){ got[i]=true; api.save('got',got);
      if(Object.keys(got).length<TOT){ toast(L.tGot(i+1)); move(1);} else draw(); });
    on(again,'click',function(){ flipped=false; draw(); toast(L.tAgain); });
    function done(){
      if(after.childNodes.length) return;
      var f=card();
      f.innerHTML='<div class="reveal"><div class="big">'+L.doneBig+'</div>'+
                  '<p style="margin:10px 0 0;color:var(--ink2)">'+L.doneTx+'</p></div>';
      after.appendChild(f);
      api.complete(L.tDone, 120);
    }
    draw();
  }
});

  en:{

    sents:[
      ['My app looks at a ',0,', the AI makes a ',1,', and then a ',2,' taps ',3,' before anything happens.'],
      ['If the AI is ',4,', my app should ask the human ',5,' questions, not fewer.']
    ],
    lab2:'Extension',
    count:function(n){return n+' of 6 blanks filled correctly';},
    okFb:function(w){return '✅ “'+w+'” fits.';},
    noFb:function(w){return '❌ “'+w+'” does not go there. Walk the loop again: look → predict → human → confirm.';},
    tapTip:function(w){return 'Now tap the blank where “'+w+'” belongs';},

    ],
    lab2:'विस्तार',

    okFb:function(w){return '✅ “'+w+'” यहाँ सही बैठता है।';},
    noFb:function(w){return '❌ “'+w+'” यहाँ नहीं आता। चक्र फिर दोहराइए: देखना → अनुमान → इंसान → पुष्टि।';},
    tapTip:function(w){return 'अब उस खाली जगह पर टैप कीजिए जहाँ “'+w+'” आता है';},
    blueBig:'मेरा लोकल हीरो - ख़ाका',
    steps:[['📷','तस्वीर','यह देखता है'],['🤖','अनुमान','AI अनुमान लगाता है'],['🧑','इंसान','इंसान जाँचता है'],['✅','पुष्टि','फिर काम होता है']],
    big:'आपने अभी-अभी एक ह्यूमन-इन-द-लूप ऐप डिज़ाइन किया।',
    body:'छह शब्द, और आपका प्रोटोटाइप वह काम कर रहा है जो कई असली प्रोडक्ट भूल जाते हैं: वह रुककर पूछता है। और दूसरा वाक्य वही हिस्सा है जिसे ज़्यादातर लोग उल्टा समझते हैं। जब मशीन <b>कम</b> यक़ीन में हो, तो उसे इंसान को <b>ज़्यादा</b> टोकना चाहिए, चुपचाप अंदाज़ा नहीं लगाना चाहिए।',

reg({
  id:'hero', xp:180,
  title:{en:'Build Your Local Hero', hi:'अपना लोकल हीरो बनाइए'},
  h5p:{en:'Drag the Words', hi:'शब्द खींचिए'},
  time:{en:'19–25 min', hi:'19–25 मिनट'},
  slides:{en:'Slide 11 - The prototype', hi:'स्लाइड 11 - प्रोटोटाइप'},
  lede:{en:'You have sketched an app. Now say what it does in one sentence, the same sentence a real designer would use. Fill all six blanks.',
        hi:'आपने एक ऐप का ख़ाका बनाया है। अब एक वाक्य में बताइए कि वह करता क्या है, वही वाक्य जो कोई असली डिज़ाइनर बोलता। छहों खाली जगहें भरिए।'},
  render:function(root, api){
    var L=T(A4), ANS=L.ans;
    var filled=api.get('filled',{});
    var order=api.get('order',null);
    if(!order){ order=shuffle([0,1,2,3,4,5]); api.save('order',order); }
    var sel=null;

    var c=card(); c.innerHTML='<h3>'+L.h3+'</h3>';
    var blanks=[];
    L.sents.forEach(function(parts, si){
      if(si===1) c.appendChild(el('div','navsec', L.lab2));
      var s=el('div','sent');
      parts.forEach(function(part){
        if(typeof part==='string'){ s.appendChild(document.createTextNode(part)); return; }
        var idx=part;
        var b=el('span','blank'); b.textContent='________';
        b.setAttribute('role','button'); b.tabIndex=0;
        b.addEventListener('dragover',function(e){e.preventDefault(); b.classList.add('hot');});
        b.addEventListener('dragleave',function(){b.classList.remove('hot');});
        b.addEventListener('drop',function(e){e.preventDefault(); b.classList.remove('hot');
          drop(parseInt(e.dataTransfer.getData('text/plain'),10), idx, b);});
        on(b,'click',function(){ if(sel!==null) drop(sel, idx, b); });
        on(b,'keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&sel!==null){e.preventDefault(); drop(sel,idx,b);} });
        blanks[idx]=b; s.appendChild(b);
      });
      c.appendChild(s);
    });
    c.appendChild(el('div','navsec', L.bank));
    var bank=el('div','wordbank'); c.appendChild(bank);
    var cnt=el('div','counter'); cnt.style.marginTop='12px'; c.appendChild(cnt);
    var fb=el('div'); fb.style.marginTop='10px'; c.appendChild(fb);
    root.appendChild(c);
    var after=el('div'); root.appendChild(after);

    function drawBank(){
      bank.innerHTML='';
      order.forEach(function(wi){
        var used=!!filled[wi];
        var d=el('div','word'+(used?' used':'')+(sel===wi?' sel':''), ANS[wi]);
        d.draggable=!used; d.setAttribute('role','button'); d.tabIndex=used?-1:0;
        d.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',String(wi)); sel=wi;});
        on(d,'click',function(){ sel=(sel===wi?null:wi); drawBank(); if(sel!==null) toast(L.tapTip(ANS[wi])); });
        on(d,'keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault(); d.click();} });
        bank.appendChild(d);
      });
      var n=Object.keys(filled).length;
      cnt.textContent=L.count(n); cnt.classList.toggle('ok', n===6);
      blanks.forEach(function(b,ix){ if(filled[ix]){ b.textContent=ANS[ix]; b.className='blank good'; } });
      if(n===6) done();
    }
    function drop(wi, idx, node){
      sel=null;
      if(filled[idx]){ drawBank(); return; }
      if(wi===idx){
        filled[idx]=true; api.save('filled',filled);
        node.textContent=ANS[idx]; node.className='blank good';
        fb.innerHTML='<div class="fb y">'+L.okFb(ANS[wi])+'</div>';
      } else {
        node.classList.add('bad'); node.textContent=ANS[wi];
        fb.innerHTML='<div class="fb n">'+L.noFb(ANS[wi])+'</div>';
        setTimeout(function(){ node.className='blank'; node.textContent='________'; }, 750);
      }
      drawBank();
    }
    function done(){
      if(after.childNodes.length) return;
      var bp=card();
      var html='<div style="text-align:center;font:800 11px/1 var(--ff);letter-spacing:.16em;'+
               'text-transform:uppercase;color:var(--muted);margin-bottom:16px">'+L.blueBig+'</div>'+
               '<div class="steprow">';
      L.steps.forEach(function(s,ix){
        html+='<div class="stepbox"><div class="em">'+s[0]+'</div><b>'+s[1]+'</b><span>'+s[2]+'</span></div>';
        if(ix<L.steps.length-1) html+='<div class="steparr">→</div>';
      });
      html+='</div>';
      bp.innerHTML=html;
      after.appendChild(bp);
      var f=card();
      f.innerHTML='<div class="reveal"><div class="big">'+L.big+'</div>'+
                  '<p style="margin:10px 0 0;color:var(--ink2)">'+L.body+'</p></div>';
      f.appendChild(hint(L.hint));
      after.appendChild(f);
      api.complete(L.tDone, 180);
      after.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    drawBank();
  }
});
